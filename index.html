<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jay's Freedom Counter</title>
    <style>
        /* Reset and layout setup */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            /* Deep dark law-enforcement blue background */
            background-color: #040c17;
            color: #ffffff;
            text-align: center;
            padding: 20px;
        }

        /* Container card */
        .counter-container {
            background: rgba(11, 27, 51, 0.88); 
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.7);
            border: 2px solid #1e40af; /* Metro Blue border accent */
            max-width: 800px;
            width: 100%;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 5px;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.9);
            color: #ffffff;
        }

        .subtitle {
            font-size: 1.2rem;
            margin-bottom: 40px;
            color: #60a5fa; /* Vibrant soft blue label highlight */
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.5);
        }

        /* Countdown display grid */
        .countdown {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 20px;
        }

        .time-box {
            background: rgba(2, 6, 12, 0.65);
            padding: 22px 20px;
            border-radius: 12px;
            min-width: 135px;
            flex: 1;
            border: 1px solid rgba(30, 64, 175, 0.4);
            box-shadow: inset 0 2px 8px rgba(0,0,0,0.5);
        }

        /* Color formatting rules specified */
        .number {
            display: block;
            font-size: 3.6rem;
            font-weight: 700;
            color: #ffff00; /* Yellow numbers for Days, Hours, and Minutes */
            text-shadow: 0 0 15px rgba(255, 255, 0, 0.35);
        }

        /* Custom rule: Red numbers strictly for the seconds module */
        .seconds-box .number {
            color: #ff0000; /* Red numbers for Seconds */
            text-shadow: 0 0 15px rgba(255, 0, 0, 0.4);
        }

        .label {
            display: block;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-top: 12px;
            color: #ffffff; /* White labels for text headings */
            font-weight: 500;
        }

        /* Arrival state block */
        #expired-message {
            font-size: 2.5rem;
            color: #ffff00;
            display: none;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(255,255,0,0.4);
        }

        /* Adaptive screen layouts */
        @media (max-width: 600px) {
            h1 { font-size: 2.1rem; }
            .subtitle { font-size: 0.95rem; margin-bottom: 25px; }
            .number { font-size: 2.4rem; }
            .time-box { min-width: 105px; padding: 15px 10px; }
        }
    </style>
</head>
<body>

    <div class="counter-container">
        <h1>Jay's Freedom Counter</h1>
        <p class="subtitle">Honoring 30 Years of Metro Nashville Police Service</p>
        
        <div id="countdown-display" class="countdown">
            <div class="time-box">
                <span id="days" class="number">00</span>
                <span class="label">Days</span>
            </div>
            <div class="time-box">
                <span id="hours" class="number">00</span>
                <span class="label">Hours</span>
            </div>
            <div class="time-box">
                <span id="minutes" class="number">00</span>
                <span class="label">Minutes</span>
            </div>
            <div class="time-box seconds-box">
                <span id="seconds" class="number">00</span>
                <span class="label">Seconds</span>
            </div>
        </div>

        <div id="expired-message">Happy Retirement, Jay! Thank you for protecting Nashville!</div>
    </div>

    <script>
        // Exact target config: February 11th, 2030 at 1600 hours (4:00 PM local time)
        const targetDate = new Date("Feb 11, 2030 16:00:00").getTime();

        const interval = setInterval(function() {
            const now = new Date().getTime();
            const difference = targetDate - now;

            const days = Math.floor(difference / (1000 * 60 * 60 * 24));
            const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((difference % (1000 * 60)) / 1000);

            document.getElementById("days").innerText = days < 10 ? "0" + days : days;
            document.getElementById("hours").innerText = hours < 10 ? "0" + hours : hours;
            document.getElementById("minutes").innerText = minutes < 10 ? "0" + minutes : minutes;
            document.getElementById("seconds").innerText = seconds < 10 ? "0" + seconds : seconds;

            if (difference < 0) {
                clearInterval(interval);
                document.getElementById("countdown-display").style.display = "none";
                document.getElementById("expired-message").style.display = "block";
            }
        }, 1000);
    </script>

</body>
</html>
