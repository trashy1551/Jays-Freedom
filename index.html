<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jay's Freedom Counter</title>
    <style>
        /* Resets and background setup */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            text-align: center;
            position: relative;
            /* Deep blue dark base under the transparent logo */
            background-color: #050f23; 
            overflow-x: hidden;
        }

        /* 
           Using a pseudo-element allows us to change the background image's 
           opacity/semi-transparency without bleeding into your text elements.
        */
        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* 
               REPLACE 'your-image-filename.png' with the actual path or local filename 
               of the Nashville Police logo you just uploaded to me.
            */
            background: linear-gradient(rgba(10, 25, 47, 0.65), rgba(5, 15, 35, 0.75)), 
                        url('police-logo.jpg') no-repeat center center fixed;
            background-size: contain; /* Keeps the circular logo shape clean without cropping */
            opacity: 0.35; /* Adjust this decimal value to make it more or less semi-transparent */
            z-index: -1; /* Pushes the image behind the text content */
        }

        /* Container card with deep police blue theme */
        .container {
            /* CHANGED OPACITY FROM 0.9 TO 0.7 FOR BETTER TRANSPARENCY */
            background: rgba(13, 27, 42, 0.7); 
            padding: 40px 60px;
            border-radius: 15px;
            box-shadow: 0 0 25px rgba(0, 102, 204, 0.4); /* Police blue ambient outer glow */
            border: 3px solid #0056b3; /* Solid royal blue frame border */
            max-width: 800px;
            width: 90%;
            position: relative;
            z-index: 1; /* Ensures text stays stacked cleanly above background layer */
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #ffffff;
            text-shadow: 0 0 10px rgba(0, 153, 255, 0.6); /* Blue title glow */
        }

        .subtitle {
            font-size: 1.2rem;
            color: #8ecae6; /* Crisp light-blue accent text */
            margin-bottom: 30px;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Countdown display block layout */
        .countdown-wrapper {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 20px;
        }

        .time-box {
            flex: 1;
            min-width: 120px;
            padding: 20px 15px;
            /* CHANGED OPACITY FROM 0.9 TO 0.6 FOR BETTER TRANSPARENCY */
            background: rgba(22, 38, 57, 0.6); 
            border-radius: 8px;
            border: 1px solid rgba(0, 153, 255, 0.3); /* Subtle blue boundary line */
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.5);
        }

        /* Styling numbers according to rules */
        .number {
            font-size: 3.5rem;
            font-weight: bold;
            display: block;
            margin-top: 5px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
        }

        /* Requirements: yellow for days/hours/minutes */
        .yellow-num {
            color: #ffff00;
        }

        /* Requirements: red for seconds */
        .red-num {
            color: #ff3333;
        }

        /* Requirement: white labels */
        .label {
            font-size: 1rem;
            color: #ffffff;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
            display: block;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Jay's Freedom Counter</h1>
        <div class="subtitle">Countdown to the monday after Nashville Superbowl = 30+ years</div>
        
        <div class="countdown-wrapper">
            <div class="time-box">
                <span class="number yellow-num" id="days">00</span>
                <span class="label">Days</span>
            </div>
            <div class="time-box">
                <span class="number yellow-num" id="hours">00</span>
                <span class="label">Hours</span>
            </div>
            <div class="time-box">
                <span class="number yellow-num" id="minutes">00</span>
                <span class="label">Minutes</span>
            </div>
            <div class="time-box">
                <span class="number red-num" id="seconds">00</span>
                <span class="label">Seconds</span>
            </div>
        </div>
    </div>

    <script>
        // Set target date: February 11th, 2030 at 16:00:00 (4:00 PM)
        const targetDate = new Date("Feb 11, 2030 16:00:00").getTime();

        function updateCountdown() {
            const now = new Date().getTime();
            const difference = targetDate - now;

            // Display message once retirement time arrives
            if (difference <= 0) {
                document.querySelector(".countdown-wrapper").innerHTML = 
                    "<h2 style='color: #ffff00; font-size: 2rem; width: 100%; text-shadow: 0 0 10px #0066cc;'>Happy Retirement, Jay! Your Shift Is Over!</h2>";
                clearInterval(timerInterval);
                return;
            }

            // Calculations for time fragments
            const days = Math.floor(difference / (1000 * 60 * 60 * 24));
            const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((difference % (1000 * 60)) / 1000);

            // Output values into HTML elements with mandatory leading zero fallback
            document.getElementById("days").innerText = days.toString().padStart(2, '0');
            document.getElementById("hours").innerText = hours.toString().padStart(2, '0');
            document.getElementById("minutes").innerText = minutes.toString().padStart(2, '0');
            document.getElementById("seconds").innerText = seconds.toString().padStart(2, '0');
        }

        // Initialize clock mechanics immediately
        updateCountdown();
        const timerInterval = setInterval(updateCountdown, 1000);
    </script>
</body>
</html>
